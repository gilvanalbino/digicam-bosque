version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: digicam-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: digicam123
      MYSQL_DATABASE: digicam_db
      MYSQL_USER: digicam_user
      MYSQL_PASSWORD: Digicam@123
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d/migrations:ro
    command: --default-authentication-plugin=mysql_native_password --init-file=/dev/null
    networks:
      - digicam-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD" ]
      timeout: 10s
      retries: 5
      interval: 30s

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: digicam-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_USER: digicam_user
      DATABASE_PASS: Digicam@123
      DATABASE_NAME: digicam_db
      DATABASE_HOST: mysql
      DATABASE_DIALECT: mysql
      JWT_KEY: MWQ4ZWMwN2Q0ODRiMDE4ODg4MDdhZTli
      SFTP_HOST: localhost
      SFTP_PORT: 22
      SFTP_USER: digicamftp
      SFTP_PASS: digitt@2008
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_images:/app/images
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - digicam-network
    command: npm run dev
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/digicam/health" ]
      timeout: 10s
      retries: 3
      interval: 30s

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: digicam-frontend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - digicam-network
    command: npm run dev
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      timeout: 10s
      retries: 3
      interval: 30s

  # Image Server (servidor-imagens)
  servidor-imagens:
    build:
      context: ./servidor-imagens
      dockerfile: Dockerfile
    container_name: digicam-servidor-imagens-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
    ports:
      - "5000:5000"
    volumes:
      - ./servidor-imagens:/app
      - /app/node_modules
      - backend_images:/app/images:ro
    networks:
      - digicam-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      timeout: 10s
      retries: 3
      interval: 30s

  # License Plate Verification Service
  verificar-novas-placas:
    build:
      context: ./verificar-novas-placas
      dockerfile: Dockerfile
    container_name: digicam-verificar-placas-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_USER: digicam_user
      DATABASE_PASS: Digicam@123
      DATABASE_NAME: digicam_db
      DATABASE_HOST: mysql
      DATABASE_DIALECT: mysql
      API_URL: http://backend:4000
      DEBUG_CURL: true
    volumes:
      - ./verificar-novas-placas:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - digicam-network
    command: npm run dev

  # Adminer (Database Management Interface)
  adminer:
    image: adminer:4.8.1
    container_name: digicam-adminer-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: galkaev
    depends_on:
      - mysql
    networks:
      - digicam-network

networks:
  digicam-network:
    driver: bridge
    name: digicam-dev-network

volumes:
  mysql_data:
    name: digicam-mysql-data
  backend_images:
    name: digicam-backend-images
