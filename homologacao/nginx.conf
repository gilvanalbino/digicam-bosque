events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Resolve os nomes dos serviços no DNS do Docker a cada 10 s, em vez de só ao iniciar o nginx: quando
    # backend ou frontend são recriados (nova versão, reboot) e mudam de IP, o nginx acompanha sem dar 502.
    # Para isso o proxy_pass usa variáveis; sem URI no proxy_pass, a requisição segue com o caminho original.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # vídeo ao vivo: o navegador abre /video/ws?src=cam<id>&token=<login>; o token vira cabeçalho Authorization
    # na consulta ao backend (auth_request) e não segue para o go2rtc
    map $request_uri $video_token {
        default "";
        "~[?&]token=(?<t>[^&]+)" $t;
    }
    map $request_uri $video_src {
        default "";
        "~[?&]src=(?<s>[A-Za-z0-9_]+)" $s;
    }

    server {
        listen 80;
        server_name _;

        set $frontend_upstream frontend:80;
        set $backend_upstream backend:4000;

        location / {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /digicam/ {
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        set $go2rtc_upstream go2rtc:1984;

        location = /video/ws {
            auth_request /_video_auth;
            access_log off;  # a URL leva o token de login
            proxy_pass http://$go2rtc_upstream/api/ws?src=$video_src;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # player do go2rtc (arquivos públicos, sem vídeo)
        location ~ ^/video/(video-stream|video-rtc)\.js$ {
            proxy_pass http://$go2rtc_upstream/$1.js;
        }

        location = /_video_auth {
            internal;
            proxy_pass http://$backend_upstream/digicam/video/autorizar?src=$video_src;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $video_token;
        }

        location /images {
            root /usr/share/nginx/html;
        }
    }
}
