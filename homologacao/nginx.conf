events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Resolve os nomes dos serviços no DNS do Docker a cada 10 s, em vez de só ao iniciar o nginx: quando
    # backend ou frontend são recriados (nova versão, reboot) e mudam de IP, o nginx acompanha sem dar 502.
    # Para isso o proxy_pass usa variáveis; sem URI no proxy_pass, a requisição segue com o caminho original.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        set $frontend_upstream frontend:80;
        set $backend_upstream backend:4000;

        location / {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /digicam/ {
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /images {
            root /usr/share/nginx/html;
        }
    }
}
