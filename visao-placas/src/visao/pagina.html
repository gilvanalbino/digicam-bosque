<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visão B2 (protótipo)</title>
<style>
  :root { --fundo:#f4f5f7; --cartao:#fff; --texto:#1f2933; --suave:#616e7c; --borda:#d9dee4;
          --verde:#1f7a4d; --amarelo:#a86b00; --vermelho:#b42318; --azul:#1d4ed8; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--fundo); color:var(--texto); }
  header { background:#111827; color:#fff; padding:12px 16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .status { font-size:12px; color:#cbd5e1; }
  header input { padding:4px 6px; border-radius:4px; border:0; }
  main { padding:16px; max-width:1300px; margin:0 auto; }
  .aviso { background:#fff7e6; border:1px solid #f0c36d; padding:12px; border-radius:6px; }
  .cartoes { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:10px; margin-bottom:16px; }
  .cartao { background:var(--cartao); border:1px solid var(--borda); border-radius:8px; padding:10px 12px; cursor:pointer; }
  .cartao.ativo { outline:2px solid var(--azul); }
  .cartao .n { font-size:24px; font-weight:700; }
  .cartao .d { color:var(--suave); font-size:12px; }
  .cartao .c { color:var(--suave); font-size:11px; margin-top:4px; }
  table { width:100%; border-collapse:collapse; background:var(--cartao); border:1px solid var(--borda); }
  th, td { padding:6px 8px; border-bottom:1px solid var(--borda); text-align:left; vertical-align:middle; }
  th { font-size:12px; color:var(--suave); font-weight:600; background:#f9fafb; }
  td img.foto { width:200px; height:113px; object-fit:cover; border-radius:4px; cursor:zoom-in; background:#e5e7eb; display:block; }
  td img.placa { height:40px; border-radius:3px; background:#e5e7eb; display:block; }
  .placa-txt { font-family:ui-monospace, monospace; font-weight:700; letter-spacing:1px; }
  .tag { display:inline-block; padding:1px 6px; border-radius:10px; font-size:11px; font-weight:600; background:#eef2ff; color:var(--azul); }
  .tag.ambos_igual { background:#e7f6ee; color:var(--verde); }
  .tag.ambos_diferente, .tag.ambos_sem_placa { background:#fff4e0; color:var(--amarelo); }
  .tag.so_software_placa, .tag.so_software_sem_placa { background:#e8efff; color:var(--azul); }
  .tag.so_camera { background:#fde8e7; color:var(--vermelho); }
  .suave { color:var(--suave); font-size:12px; }
  #ampliada { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:10; cursor:zoom-out; }
  #ampliada img { max-width:96vw; max-height:92vh; }
  .tabela { overflow-x:auto; }
</style>
</head>
<body>
<header>
  <h1>Visão por software · <span id="camera">Entrada B2</span> · protótipo (HML)</h1>
  <label>Dia <input type="date" id="dia"></label>
  <span class="status" id="status"></span>
</header>
<main>
  <div id="semLogin" class="aviso" hidden>
    Entre no sistema nesta mesma aba (<a href="/">abrir o login</a>) e depois volte para <code>/visao/</code>.
  </div>
  <div id="conteudo" hidden>
    <div class="cartoes" id="cartoes"></div>
    <div class="tabela"><table><thead id="cabecalho"></thead><tbody id="linhas"></tbody></table></div>
    <p class="suave" id="rodape"></p>
  </div>
</main>
<div id="ampliada"><img alt=""></div>
<script>
const ORDEM = ["ambos_igual", "ambos_diferente", "ambos_sem_placa", "so_camera", "so_software_placa",
               "so_software_sem_placa", "saida", "pendente"];
const DIRECAO = { entrada: "Entrada", saida: "Saída" };
let token = null;
try { token = (JSON.parse(sessionStorage.getItem("digicam.sessao")) || {}).token || null; } catch (e) { token = null; }
let categoria = null;

const api = async (caminho) => {
  const r = await fetch("/visao/api/" + caminho, { headers: { Authorization: token } });
  if (r.status === 401 || r.status === 403) { mostrarSemLogin(); throw new Error("sem login"); }
  if (!r.ok) throw new Error("erro " + r.status);
  return r;
};
const hora = (t) => t ? new Date(t * 1000).toLocaleTimeString("pt-BR") : "";
const hoje = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function mostrarSemLogin() {
  document.getElementById("semLogin").hidden = false;
  document.getElementById("conteudo").hidden = true;
}

// fotos: buscadas com o login e carregadas só quando aparecem na tela
const urls = new Map();
const observador = new IntersectionObserver((itens) => {
  for (const item of itens) {
    if (!item.isIntersecting) continue;
    observador.unobserve(item.target);
    carregarFoto(item.target);
  }
}, { rootMargin: "300px" });
async function carregarFoto(img) {
  const caminho = img.dataset.foto;
  if (!urls.has(caminho)) {
    try { urls.set(caminho, URL.createObjectURL(await (await api("foto/" + caminho)).blob())); }
    catch (e) { return; }
  }
  img.src = urls.get(caminho);
}
function imagem(caminho, classe) {
  return caminho ? `<img class="${classe}" data-foto="${esc(caminho)}" alt="">` : '<span class="suave">—</span>';
}

async function carregarStatus() {
  const s = await (await api("status")).json();
  document.getElementById("camera").textContent = s.camera;
  const ultimo = s.ultimo_quadro ? `último quadro ${hora(s.ultimo_quadro)}` : "sem vídeo";
  document.getElementById("status").textContent =
    `${ultimo} · ${s.tempo_medio_ms} ms/quadro · ${s.descartados} quadros descartados · ` +
    `${s.passagens} passagens desde o início · ${s.espaco_usado_mb} MB de fotos` +
    (s.erro_comparacao ? ` · comparação com erro: ${s.erro_comparacao}` : "");
}

async function carregarResumo(dia) {
  const r = await (await api("resumo?dia=" + dia)).json();
  const html = ORDEM.filter((c) => r.categorias[c]).map((c) => {
    const info = r.categorias[c];
    const classes = Object.entries(info.por_classe).map(([k, v]) => `${k}: ${v}`).join(" · ");
    return `<div class="cartao ${c === categoria ? "ativo" : ""}" data-c="${c}">
      <div class="n">${info.total}</div><div class="d">${esc(r.descricoes[c] || c)}</div>
      <div class="c">${esc(classes)}</div></div>`;
  }).join("");
  const cartoes = document.getElementById("cartoes");
  cartoes.innerHTML = `<div class="cartao ${categoria ? "" : "ativo"}" data-c=""><div class="n">Todas</div>
    <div class="d">Passagens vistas pelo software</div></div>` + html;
  cartoes.querySelectorAll(".cartao").forEach((el) => el.onclick = () => {
    categoria = el.dataset.c || null; atualizar();
  });
}

async function carregarLista(dia) {
  const q = `passagens?dia=${dia}` + (categoria ? `&categoria=${categoria}` : "");
  const linhas = await (await api(q)).json();
  const cab = document.getElementById("cabecalho");
  const corpo = document.getElementById("linhas");
  if (categoria === "so_camera") {
    cab.innerHTML = "<tr><th>Hora</th><th>Placa lida pela câmera</th><th>Tráfego</th></tr>";
    corpo.innerHTML = linhas.map((l) => `<tr><td>${hora(l.instante)}</td>
      <td class="placa-txt">${esc(l.placa)}</td><td class="suave">#${l.trafego_id}</td></tr>`).join("");
  } else {
    cab.innerHTML = `<tr><th>Hora</th><th>Foto</th><th>Placa (software)</th><th>Recorte</th>
      <th>Placa (câmera)</th><th>Tipo</th><th>Sentido</th><th>Resultado</th></tr>`;
    corpo.innerHTML = linhas.map((l) => `<tr>
      <td>${hora(l.instante)}</td>
      <td>${imagem(l.foto, "foto")}</td>
      <td><span class="placa-txt">${esc(l.placa || "—")}</span>
          <div class="suave">${l.placa ? `conf. ${l.confianca} · ${l.leituras_placa}/${l.leituras_validas} leituras` : `${l.tentativas_placa} tentativas`}</div></td>
      <td>${imagem(l.foto_placa, "placa")}</td>
      <td><span class="placa-txt">${esc(l.camera_placa || "—")}</span>
          <div class="suave">${l.camera_instante ? hora(l.camera_instante) : ""}</div></td>
      <td>${esc(l.classe)}</td>
      <td>${esc(DIRECAO[l.direcao] || l.direcao)}</td>
      <td><span class="tag ${esc(l.comparacao)}">${esc(l.comparacao)}</span></td></tr>`).join("");
    corpo.querySelectorAll("img[data-foto]").forEach((img) => observador.observe(img));
    corpo.querySelectorAll("img.foto").forEach((img) => img.onclick = () => {
      const amp = document.getElementById("ampliada");
      amp.querySelector("img").src = img.src; amp.style.display = "flex";
    });
  }
  document.getElementById("rodape").textContent = `${linhas.length} linhas · atualizado às ${new Date().toLocaleTimeString("pt-BR")}`;
}

async function atualizar() {
  const dia = document.getElementById("dia").value || hoje();
  try {
    await Promise.all([carregarStatus(), carregarResumo(dia), carregarLista(dia)]);
    document.getElementById("conteudo").hidden = false;
  } catch (e) { console.log(e); }
}

document.getElementById("ampliada").onclick = (e) => e.currentTarget.style.display = "none";
document.getElementById("dia").value = hoje();
document.getElementById("dia").onchange = atualizar;
if (!token) { mostrarSemLogin(); } else {
  atualizar();
  setInterval(() => { if ((document.getElementById("dia").value || hoje()) === hoje()) atualizar(); }, 30000);
}
</script>
</body>
</html>
